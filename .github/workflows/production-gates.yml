name: production-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Java unit and architecture tests
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend locked install and tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Python contract and security tests
        run: |
          python -m pip install --requirement services/document-intelligence/requirements-test.txt
          python -m pytest -q services/document-intelligence services/ai-orchestrator

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/java p/python p/typescript p/owasp-top-ten
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,secrets
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-filesystem.sarif
      - uses: anchore/sbom-action@v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: release-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            *.sarif
            release-sbom.spdx.json

  container-security:
    runs-on: ubuntu-24.04
    needs: build-and-test
    strategy:
      matrix:
        include:
          - name: backend
            context: .
          - name: document-intelligence
            context: services/document-intelligence
          - name: ai-orchestrator
            context: services/ai-orchestrator
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: specai/${{ matrix.name }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: specai/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: trivy-${{ matrix.name }}.json
      - uses: anchore/sbom-action@v0.17.9
        with:
          image: specai/${{ matrix.name }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-evidence-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.json
            sbom-${{ matrix.name }}.cdx.json
