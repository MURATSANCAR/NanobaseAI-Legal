# EasyMeeting / portal.nanobase.ai overlay.
# Uses Actenora shared Postgres/Redis/RabbitMQ/MinIO + host LLM.
# Usage on server:
#   docker compose -f compose.yaml -f compose.easymeeting.yaml \
#     --env-file /etc/nanobaseai/legal.env up -d --build

name: specai-legal

services:
  postgres:
    profiles: [never]
  minio:
    profiles: [never]
  minio-init:
    profiles: [never]
  rabbitmq:
    profiles: [never]
  redis:
    profiles: [never]

  clamav:
    networks:
      - specai

  document-intelligence:
    environment:
      S3_ENDPOINT: http://actenora-prodlike-minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_SOURCE_BUCKET: specai-original
      TEMPORARY_DIRECTORY: /var/lib/specai/tmp
      WORKER_THREADS: "1"
      # Legacy single-shot ceiling (non-PDF / emergency). Bounded PDF path uses layered timeouts.
      PROCESSING_TIMEOUT_SECONDS: "1200"
      BOUNDED_PARSING_ENABLED: "true"
      PARSER_BATCH_SIZE: "1"
      PARSER_BATCH_TIMEOUT_SECONDS: "900"
      PARSER_PAGE_TIMEOUT_SECONDS: "360"
      PARSER_DOCUMENT_ORCHESTRATION_TIMEOUT_SECONDS: "43200"
      PARSER_MAX_BATCH_ATTEMPTS: "3"
      PARSER_NATIVE_TEXT_MIN_CHARS: "40"
      PARSER_IMAGES_SCALE: "0.85"
      PDF_INSPECTOR_ENABLED: "true"
      PDF_INSPECTOR_TIMEOUT_SECONDS: "8"
      PDF_INSPECTOR_MAX_PAGES_FOR_FULL_EXTRACT: "120"
      PDF_INSPECTOR_MIN_CONFIDENCE: "0.55"
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 1G
    networks:
      - specai
      - actenora-data
    depends_on: !override {}
    # Avoid read-only /tmp permission issues with nested TEMPORARY_DIRECTORY.
    read_only: false
    tmpfs: !override
      - /tmp:size=2g,mode=1777

  opencontracts:
    environment:
      DOCLING_BASE_URL: http://document-intelligence:8090
      S3_SOURCE_BUCKET: specai-original
      OPENCONTRACTS_API_TOKEN: ${OPENCONTRACTS_API_TOKEN:-}
    networks:
      - specai

  ai-orchestrator:
    environment:
      TZ: Europe/Istanbul
      MODEL_DEPLOYMENTS_JSON: ${AI_MODEL_DEPLOYMENTS_JSON}
      LOG_LEVEL: ${AI_ORCHESTRATOR_LOG_LEVEL:-INFO}
      FAULT_INJECTION_ENABLED: ${AI_ORCHESTRATOR_FAULT_INJECTION_ENABLED:-false}
      FAULT_INJECTION_TOKEN: ${AI_ORCHESTRATOR_FAULT_INJECTION_TOKEN:-}
      MODEL_CAPACITY_PROVIDER: ${MODEL_CAPACITY_PROVIDER:-redis}
      MODEL_CAPACITY_FAILURE_POLICY: ${MODEL_CAPACITY_FAILURE_POLICY:-FAIL_CLOSED}
      MODEL_CAPACITY_LEASE_TTL_MS: ${MODEL_CAPACITY_LEASE_TTL_MS:-120000}
      MODEL_CAPACITY_HEARTBEAT_INTERVAL_SECONDS: ${MODEL_CAPACITY_HEARTBEAT_INTERVAL_SECONDS:-30}
      AI_ORCHESTRATOR_BALANCED_GENERATION_TIMEOUT: ${AI_ORCHESTRATOR_BALANCED_GENERATION_TIMEOUT:-}
      REDIS_HOST: actenora-prodlike-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ORCHESTRATOR_INSTANCE_ID: ${ORCHESTRATOR_INSTANCE_ID:-orchestrator-a}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - specai
      - actenora-data

  backend:
    environment:
      TZ: Europe/Istanbul
      DATABASE_URL: jdbc:postgresql://actenora-prodlike-postgres:5432/specai
      DATABASE_USER: ${DATABASE_USER:-specai}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      SPECAI_AUTH_MODE: local
      SPECAI_AUTO_LOGIN: "true"
      SPECAI_JWT_SECRET: ${SPECAI_JWT_SECRET}
      SPECAI_LOCAL_ADMIN_EMAIL: ${SPECAI_LOCAL_ADMIN_EMAIL:-admin@nanobase.local}
      SPECAI_LOCAL_ADMIN_PASSWORD: ${SPECAI_LOCAL_ADMIN_PASSWORD}
      SPECAI_BOOTSTRAP_ENABLED: "true"
      SPECAI_BOOTSTRAP_TENANT_ID: ${SPECAI_BOOTSTRAP_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      SPECAI_BOOTSTRAP_TENANT_NAME: ${SPECAI_BOOTSTRAP_TENANT_NAME:-Nano Teknoloji A.Ş.}
      MINIO_ENDPOINT: http://actenora-prodlike-minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_CREATE_BUCKETS: "true"
      RABBITMQ_HOST: actenora-prodlike-rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-actenora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      REDIS_HOST: actenora-prodlike-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      FILE_SECURITY_FAIL_CLOSED: "true"
      DOCUMENT_INTELLIGENCE_ENABLED: "true"
      DOCLING_ENABLED: "true"
      DOCLING_BASE_URL: http://document-intelligence:8090
      OPENCONTRACTS_ENABLED: "true"
      OPENCONTRACTS_BASE_URL: http://opencontracts:8091
      OPENCONTRACTS_API_TOKEN: ${OPENCONTRACTS_API_TOKEN:-}
      AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:8090
      SPECAI_AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:8090
      # Host llama-server is single-slot and often saturated; keep backend waits aligned with orchestrator.
      AI_ORCHESTRATOR_KNOWLEDGE_READ_TIMEOUT: ${AI_ORCHESTRATOR_KNOWLEDGE_READ_TIMEOUT:-PT600S}
      AI_ORCHESTRATOR_COMPLIANCE_READ_TIMEOUT: ${AI_ORCHESTRATOR_COMPLIANCE_READ_TIMEOUT:-PT780S}
      AI_ORCHESTRATOR_COMPLIANCE_GLOBAL_DEADLINE: ${AI_ORCHESTRATOR_COMPLIANCE_GLOBAL_DEADLINE:-PT820S}
      AI_ORCHESTRATOR_COMPLIANCE_RETRY_ATTEMPTS: ${AI_ORCHESTRATOR_COMPLIANCE_RETRY_ATTEMPTS:-1}
      AI_ORCHESTRATOR_COMPLIANCE_MAX_OUTPUT_TOKENS: ${AI_ORCHESTRATOR_COMPLIANCE_MAX_OUTPUT_TOKENS:-1024}
      COMPLIANCE_ROUTING_MODE: ${COMPLIANCE_ROUTING_MODE:-BALANCED_ONLY}
      COMPLIANCE_FAST_ENABLED: ${COMPLIANCE_FAST_ENABLED:-false}
      COMPLIANCE_SHADOW_ENABLED: ${COMPLIANCE_SHADOW_ENABLED:-false}
      COMPLIANCE_SHADOW_SAMPLE_RATE: ${COMPLIANCE_SHADOW_SAMPLE_RATE:-0}
      COMPLIANCE_EVALUATION_PARALLELISM: ${COMPLIANCE_EVALUATION_PARALLELISM:-1}
      COMPLIANCE_LIVE_PROFILE: ${COMPLIANCE_LIVE_PROFILE:-BALANCED}
      COMPLIANCE_FAST_PROFILE: ${COMPLIANCE_FAST_PROFILE:-FAST}
      COMPLIANCE_FAST_MAX_OUTPUT_TOKENS: ${COMPLIANCE_FAST_MAX_OUTPUT_TOKENS:-768}
      COMPLIANCE_ESCALATE_CONFIDENCE_BELOW: ${COMPLIANCE_ESCALATE_CONFIDENCE_BELOW:-0.80}
      COMPLIANCE_ESCALATE_EVIDENCE_ABOVE: ${COMPLIANCE_ESCALATE_EVIDENCE_ABOVE:-2}
      COMPLIANCE_FAST_RELEVANCE_THRESHOLD: ${COMPLIANCE_FAST_RELEVANCE_THRESHOLD:-0.80}
      COMPLIANCE_FAST_FINAL_DECISION_THRESHOLD: ${COMPLIANCE_FAST_FINAL_DECISION_THRESHOLD:-0.95}
      COMPLIANCE_FAULT_INJECTION_ENABLED: ${COMPLIANCE_FAULT_INJECTION_ENABLED:-false}
      COMPLIANCE_FAULT_INJECTION_TOKEN: ${COMPLIANCE_FAULT_INJECTION_TOKEN:-}
      COMPLIANCE_WORKER_CONCURRENCY: ${COMPLIANCE_WORKER_CONCURRENCY:-1}
      COMPLIANCE_WORKER_MAX_CONCURRENCY: ${COMPLIANCE_WORKER_MAX_CONCURRENCY:-1}
      COMPLIANCE_DB_OPERATIONAL_HEADROOM: ${COMPLIANCE_DB_OPERATIONAL_HEADROOM:-2}
      COMPLIANCE_DEPLOYMENT_GUARDRAILS_ENFORCE: ${COMPLIANCE_DEPLOYMENT_GUARDRAILS_ENFORCE:-false}
      COMPLIANCE_REQUIRE_REDIS_CAPACITY: ${COMPLIANCE_REQUIRE_REDIS_CAPACITY:-false}
      # Backward-compatible aliases used by older test scripts.
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: ${COMPLIANCE_WORKER_CONCURRENCY:-1}
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: ${COMPLIANCE_WORKER_MAX_CONCURRENCY:-1}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_POOL_MIN_IDLE: ${DATABASE_POOL_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-${DATABASE_POOL_MIN_IDLE:-1}}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-5000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://portal.nanobase.ai}
    ports: !override
      # 8089 is Apache Superset on the portal host — keep Legal API off that port.
      - "127.0.0.1:8098:8080"
    depends_on: !override
      document-intelligence:
        condition: service_healthy
      opencontracts:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - specai
      - actenora-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Base compose uses read_only + /tmp mode=1770; Tomcat cannot create tempDir.
    read_only: false
    tmpfs: !override
      - /tmp:size=512m,mode=1777

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://portal.nanobase.ai/legal-api}
        NEXT_PUBLIC_BASE_PATH: ${PUBLIC_BASE_PATH:-/legal}
        NEXT_PUBLIC_AUTO_LOGIN: "true"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://portal.nanobase.ai/legal-api}
      NEXT_PUBLIC_BASE_PATH: ${PUBLIC_BASE_PATH:-/legal}
      NEXT_PUBLIC_AUTO_LOGIN: "true"
    ports: !override
      - "127.0.0.1:3020:3000"
    networks:
      - specai
    # Portal is built with basePath=/legal; nginx proxies /legal/ → container /legal/
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/legal/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]

networks:
  specai:
    name: specai-legal-network
    driver: bridge
  actenora-data:
    external: true
    name: actenora-prodlike-data-network
