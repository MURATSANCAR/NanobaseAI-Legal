services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: specai
      POSTGRES_USER: specai
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specai -d specai"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-specai}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-minio-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/specai-original;
      mc anonymous set none local/specai-original;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-specai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-secret}
  rabbitmq:
    image: rabbitmq:4.1.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-specai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbit-secret}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:8.0.2-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-local-redis-secret}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-secret}
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-keycloak-admin}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak/specai-realm.json:/opt/keycloak/data/import/specai-realm.json:ro
    restart: unless-stopped
  backend:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/specai
      DATABASE_USER: specai
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-dev-only}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8081/realms/specai}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/specai/protocol/openid-connect/certs
      SPECAI_BOOTSTRAP_ENABLED: "true"
      SPECAI_BOOTSTRAP_TENANT_ID: 11111111-1111-1111-1111-111111111111
      SPECAI_BOOTSTRAP_TENANT_NAME: Nano Teknoloji A.Ş.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-specai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-specai}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbit-secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-secret}
      DOCUMENT_WORKER_TOKEN: ${DOCUMENT_WORKER_TOKEN:-local-worker-secret}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
  clamav:
    image: clamav/clamav:1.4.3
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  document-worker:
    build:
      context: ./services/document-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-specai}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbit-secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-specai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-secret}
      BACKEND_URL: http://backend:8080
      DOCUMENT_WORKER_TOKEN: ${DOCUMENT_WORKER_TOKEN:-local-worker-secret}
      CLAMAV_HOST: clamav
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8081/realms/specai
      NEXT_PUBLIC_OIDC_CLIENT_ID: specai-portal
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  redis-data:
  clamav-data:
