services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: specai
      POSTGRES_USER: specai
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specai -d specai"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
