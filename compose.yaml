name: specai

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: specai
      POSTGRES_USER: specai
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specai -d specai"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [specai]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-specai}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [specai]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set local http://minio:9000 \"$${MINIO_ACCESS_KEY}\" \"$${MINIO_SECRET_KEY}\";
      for bucket in specai-original specai-processed specai-thumbnails specai-reports specai-temp; do
        mc mb --ignore-existing \"local/$${bucket}\";
        mc anonymous set none \"local/$${bucket}\";
      done
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-specai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
    networks: [specai]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-specai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [specai]
    restart: unless-stopped

  redis:
    image: redis:8.0.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [specai]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.3
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [specai]
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/specai
      DATABASE_USER: specai
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      SPECAI_AUTH_MODE: ${SPECAI_AUTH_MODE:-local}
      SPECAI_JWT_SECRET: ${SPECAI_JWT_SECRET:-}
      SPECAI_LOCAL_ADMIN_EMAIL: ${SPECAI_LOCAL_ADMIN_EMAIL:-admin@nanobase.local}
      SPECAI_LOCAL_ADMIN_PASSWORD: ${SPECAI_LOCAL_ADMIN_PASSWORD:-${LOCAL_USER_PASSWORD:-}}
      SPECAI_BOOTSTRAP_ENABLED: "true"
      SPECAI_BOOTSTRAP_TENANT_ID: 11111111-1111-1111-1111-111111111111
      SPECAI_BOOTSTRAP_TENANT_NAME: Nano Teknoloji A.Ş.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-specai}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-specai}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      FILE_SECURITY_FAIL_CLOSED: "true"
      DOCUMENT_INTELLIGENCE_ENABLED: "true"
      DOCLING_ENABLED: "true"
      DOCLING_BASE_URL: http://document-intelligence:8090
      OPENCONTRACTS_ENABLED: ${OPENCONTRACTS_ENABLED:-false}
      OPENCONTRACTS_BASE_URL: ${OPENCONTRACTS_BASE_URL:-http://opencontracts:8091}
      OPENCONTRACTS_API_TOKEN: ${OPENCONTRACTS_API_TOKEN:-}
      SPECAI_AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:8090
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      document-intelligence:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks: [specai]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    restart: unless-stopped

  document-intelligence:
    build:
      context: ./services/document-intelligence
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-specai}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      S3_SOURCE_BUCKET: specai-original
      JOB_DATABASE_PATH: /var/lib/specai/jobs.sqlite3
      TEMPORARY_DIRECTORY: /tmp/specai-docling
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-104857600}
      MAX_PAGE_COUNT: ${MAX_PAGE_COUNT:-500}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-900}
      DOCLING_TELEMETRY_ENABLED: "false"
    volumes:
      - document-intelligence-data:/var/lib/specai
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    networks: [specai]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1770,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
    environment:
      MODEL_DEPLOYMENTS_JSON: ${AI_MODEL_DEPLOYMENTS_JSON:-[]}
      LOG_LEVEL: ${AI_ORCHESTRATOR_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [specai]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ | grep -q 'Şartname'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [specai]
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  redis-data:
  document-intelligence-data:
  clamav-data:

networks:
  specai:
    name: specai-network
    driver: bridge
