spring:
  application:
    name: nanobase-specai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/specai}
    username: ${DATABASE_USER:specai}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/specai}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/specai/protocol/openid-connect/certs}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_FILE_SIZE:100MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:specai}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: SYSTEM_ADMIN,TENANT_ADMIN
  health:
    probes:
      enabled: true
    group:
      liveness:
        include: livenessState,ping
      readiness:
        include: readinessState,db,rabbit,redis,minio,documentIntelligence

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-} organizationId=%X{organizationId:-} userId=%X{userId:-} event=%X{event:-} message=\"%msg\"%n"

specai:
  bootstrap:
    enabled: ${SPECAI_BOOTSTRAP_ENABLED:false}
    tenant-id: ${SPECAI_BOOTSTRAP_TENANT_ID:00000000-0000-0000-0000-000000000000}
    tenant-name: ${SPECAI_BOOTSTRAP_TENANT_NAME:Local Tenant}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:specai}
    secret-key: ${MINIO_SECRET_KEY}
    original-bucket: specai-original
    create-buckets: ${MINIO_CREATE_BUCKETS:false}
  documents:
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:104857600}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  document-intelligence:
    enabled: ${DOCUMENT_INTELLIGENCE_ENABLED:false}
    base-url: ${DOCUMENT_INTELLIGENCE_BASE_URL:http://localhost:8090}
    api-token: ${DOCUMENT_INTELLIGENCE_API_TOKEN:}
