spring:
  application:
    name: nanobase-specai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/specai}
    username: ${DATABASE_USER:specai}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      connection-timeout: 5000
      validation-timeout: 3000
      leak-detection-threshold: ${DATABASE_LEAK_DETECTION_MS:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Europe/Istanbul
  jackson:
    time-zone: Europe/Istanbul
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}
          jwk-set-uri: ${OIDC_JWK_SET_URI:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_FILE_SIZE:100MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:specai}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        concurrency: ${COMPLIANCE_WORKER_CONCURRENCY:1}
        max-concurrency: ${COMPLIANCE_WORKER_MAX_CONCURRENCY:${COMPLIANCE_WORKER_CONCURRENCY:1}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.10}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: SYSTEM_ADMIN,TENANT_ADMIN
  health:
    probes:
      enabled: true
    group:
      liveness:
        include: livenessState,ping
      readiness:
        include: readinessState,db,rabbit,redis,minio,documentIntelligence

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} correlationId=%X{correlationId:-} organizationId=%X{organizationId:-} userId=%X{userId:-} event=%X{event:-} message=\"%msg\"%n"

specai:
  environment: ${SPECAI_ENVIRONMENT:development}
  release:
    version: ${SPECAI_RELEASE_VERSION:development}
    build-number: ${SPECAI_BUILD_NUMBER:local}
    commit-hash: ${SPECAI_COMMIT_HASH:unknown}
    date: ${SPECAI_RELEASE_DATE:unreleased}
  bootstrap:
    enabled: ${SPECAI_BOOTSTRAP_ENABLED:false}
    tenant-id: ${SPECAI_BOOTSTRAP_TENANT_ID:00000000-0000-0000-0000-000000000000}
    tenant-name: ${SPECAI_BOOTSTRAP_TENANT_NAME:Local Tenant}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${MINIO_ACCESS_KEY:specai}
    secret-key: ${MINIO_SECRET_KEY}
    original-bucket: specai-original
    create-buckets: ${MINIO_CREATE_BUCKETS:false}
  documents:
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:104857600}
  file-security:
    fail-closed: ${FILE_SECURITY_FAIL_CLOSED:true}
    clamav:
      enabled: ${CLAMAV_ENABLED:true}
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout-ms: ${CLAMAV_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${CLAMAV_READ_TIMEOUT_MS:120000}
    archive:
      maximum-entries: ${ARCHIVE_MAXIMUM_ENTRIES:10000}
      maximum-uncompressed-bytes: ${ARCHIVE_MAXIMUM_UNCOMPRESSED_BYTES:536870912}
      maximum-compression-ratio: ${ARCHIVE_MAXIMUM_COMPRESSION_RATIO:100}
    pdf:
      maximum-pages: ${PDF_MAXIMUM_PAGES:1000}
  security:
    auth-mode: ${SPECAI_AUTH_MODE:local}
    auto-login: ${SPECAI_AUTO_LOGIN:false}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      secret: ${SPECAI_JWT_SECRET:}
      issuer: ${SPECAI_JWT_ISSUER:specai-local}
      audience: ${OIDC_AUDIENCE:specai-api}
      clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}
      ttl-seconds: ${SPECAI_JWT_TTL_SECONDS:28800}
    local:
      admin-email: ${SPECAI_LOCAL_ADMIN_EMAIL:admin@nanobase.local}
      admin-password: ${SPECAI_LOCAL_ADMIN_PASSWORD:}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  rate-limits:
    upload:
      maximum: ${RATE_LIMIT_UPLOAD:10}
    signed-url:
      maximum: ${RATE_LIMIT_SIGNED_URL:30}
    processing:
      maximum: ${RATE_LIMIT_PROCESSING:20}
    sse:
      maximum: ${RATE_LIMIT_SSE:10}
    search:
      maximum: ${RATE_LIMIT_SEARCH:120}
    admin:
      maximum: ${RATE_LIMIT_ADMIN:30}
  backpressure:
    fail-closed: ${BACKPRESSURE_FAIL_CLOSED:true}
    document:
      delay-queue-depth: ${DOCUMENT_QUEUE_DELAY_DEPTH:100}
      reject-queue-depth: ${DOCUMENT_QUEUE_REJECT_DEPTH:500}
  document-intelligence:
    enabled: ${DOCUMENT_INTELLIGENCE_ENABLED:true}
    minimum-quality-score: ${DOCUMENT_MINIMUM_QUALITY_SCORE:0.50}
    docling:
      enabled: ${DOCLING_ENABLED:true}
      base-url: ${DOCLING_BASE_URL:http://localhost:8090}
    opencontracts:
      enabled: ${OPENCONTRACTS_ENABLED:false}
      base-url: ${OPENCONTRACTS_BASE_URL:http://localhost:8091}
      api-token: ${OPENCONTRACTS_API_TOKEN:}
    circuit-breaker:
      failure-threshold: ${DOCUMENT_PROVIDER_FAILURE_THRESHOLD:5}
      open-duration: ${DOCUMENT_PROVIDER_OPEN_DURATION:PT30S}
    http:
      connect-timeout: ${DOCUMENT_PROVIDER_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${DOCUMENT_PROVIDER_READ_TIMEOUT:PT180S}
  outbox:
    interval-ms: ${OUTBOX_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    maximum-retries: ${OUTBOX_MAXIMUM_RETRIES:10}
    claim-timeout: ${OUTBOX_CLAIM_TIMEOUT:PT2M}
    base-backoff: ${OUTBOX_BASE_BACKOFF:PT1S}
    maximum-backoff: ${OUTBOX_MAX_BACKOFF:PT5M}
  messaging:
    maximum-consumer-retries: ${MESSAGE_MAXIMUM_RETRIES:8}
    idempotency-processing-timeout: ${MESSAGE_PROCESSING_TIMEOUT:PT30M}
  ai-orchestrator:
    base-url: ${AI_ORCHESTRATOR_BASE_URL:${SPECAI_AI_ORCHESTRATOR_BASE_URL:http://localhost:8090}}
    connect-timeout: ${AI_ORCHESTRATOR_CONNECT_TIMEOUT:PT5S}
    knowledge-read-timeout: ${AI_ORCHESTRATOR_KNOWLEDGE_READ_TIMEOUT:PT60S}
    # Compliance must not inherit DOCUMENT_PROVIDER_READ_TIMEOUT (PT180S). Align with
    # host llama-server timeoutSeconds and knowledge extraction budget.
    # Must exceed BALANCED queueWait(180s)+generation(600s)+margin.
    # Backend must not close before orchestrator returns a controlled error.
    compliance-read-timeout: ${AI_ORCHESTRATOR_COMPLIANCE_READ_TIMEOUT:PT780S}
    compliance-global-deadline: ${AI_ORCHESTRATOR_COMPLIANCE_GLOBAL_DEADLINE:PT820S}
    # Max attempts after the first call: 1 retry => 2 total attempts.
    compliance-retry-attempts: ${AI_ORCHESTRATOR_COMPLIANCE_RETRY_ATTEMPTS:1}
    compliance-retry-backoff: ${AI_ORCHESTRATOR_COMPLIANCE_RETRY_BACKOFF:PT2S}
    compliance-max-output-tokens: ${AI_ORCHESTRATOR_COMPLIANCE_MAX_OUTPUT_TOKENS:1024}
  compliance:
    # Production V1: sequential single-slot evaluation only.
    evaluation-parallelism: ${COMPLIANCE_EVALUATION_PARALLELISM:1}
    lease-duration: ${COMPLIANCE_LEASE_DURATION:PT15M}
    reclaim-interval-ms: ${COMPLIANCE_RECLAIM_INTERVAL_MS:30000}
    reclaim-batch-size: ${COMPLIANCE_RECLAIM_BATCH_SIZE:10}
    max-attempt-count: ${COMPLIANCE_MAX_ATTEMPT_COUNT:5}
    deployment:
      # databasePoolSize >= workerConcurrency + operationalHeadroom
      operational-headroom: ${COMPLIANCE_DB_OPERATIONAL_HEADROOM:2}
      enforce: ${COMPLIANCE_DEPLOYMENT_GUARDRAILS_ENFORCE:false}
      # Production profile sets true; probes AI orchestrator /health/ready capacityProvider.
      require-redis-capacity: ${COMPLIANCE_REQUIRE_REDIS_CAPACITY:false}
    fault-injection:
      # Hard-disabled when SPECAI_ENVIRONMENT=production regardless of this flag.
      enabled: ${COMPLIANCE_FAULT_INJECTION_ENABLED:false}
      token: ${COMPLIANCE_FAULT_INJECTION_TOKEN:}
    routing:
      # BALANCED_ONLY | SHADOW | LIVE_FAST — FAST/SHADOW stay in code but are feature-flagged off.
      mode: ${COMPLIANCE_ROUTING_MODE:BALANCED_ONLY}
      fast-enabled: ${COMPLIANCE_FAST_ENABLED:false}
      shadow-enabled: ${COMPLIANCE_SHADOW_ENABLED:false}
      shadow-sample-rate: ${COMPLIANCE_SHADOW_SAMPLE_RATE:0}
      live-profile: ${COMPLIANCE_LIVE_PROFILE:BALANCED}
      fast-profile: ${COMPLIANCE_FAST_PROFILE:FAST}
      fast-max-output-tokens: ${COMPLIANCE_FAST_MAX_OUTPUT_TOKENS:768}
      escalate-confidence-below: ${COMPLIANCE_ESCALATE_CONFIDENCE_BELOW:0.80}
      escalate-evidence-above: ${COMPLIANCE_ESCALATE_EVIDENCE_ABOVE:2}
      fast-relevance-threshold: ${COMPLIANCE_FAST_RELEVANCE_THRESHOLD:0.80}
      fast-final-decision-threshold: ${COMPLIANCE_FAST_FINAL_DECISION_THRESHOLD:0.95}
  # Tender intelligence master kill switches (default OFF).
  # Even when true, org/project enablement still requires feature_assignment
  # (or feature_definition.default_state) because DB defaults are FALSE.
  tender-intelligence:
    tender-domain-v2-enabled: ${TENDER_DOMAIN_V2_ENABLED:false}
    requirement-classification-enabled: ${REQUIREMENT_CLASSIFICATION_ENABLED:false}
    company-capability-registry-enabled: ${COMPANY_CAPABILITY_REGISTRY_ENABLED:false}
    deterministic-evaluation-enabled: ${DETERMINISTIC_EVALUATION_ENABLED:false}
    gap-analysis-enabled: ${GAP_ANALYSIS_ENABLED:false}
    clarification-management-enabled: ${CLARIFICATION_MANAGEMENT_ENABLED:false}
    risk-engine-enabled: ${RISK_ENGINE_ENABLED:false}
    bid-decision-enabled: ${BID_DECISION_ENABLED:false}
    obligation-management-enabled: ${OBLIGATION_MANAGEMENT_ENABLED:false}
