# SpecAI Legal on portal.nanobase.ai
# Include inside the HTTPS server block (replace former /contracts-api/).

upstream legal_api {
    # SpecAI Legal backend (compose.easymeeting.yaml). Not 8089 — that is Superset.
    server 127.0.0.1:8098;
    keepalive 16;
}

upstream legal_portal {
    server 127.0.0.1:3020;
    keepalive 8;
}

location /legal-api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_pass http://legal_api/;
}

location = /legal {
    return 301 /legal/;
}

location /legal/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # App is built with basePath=/legal
    proxy_pass http://legal_portal;
}
