name: specai-production

services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/DATABASE_PASSWORD
    secrets: [DATABASE_PASSWORD]
    security_opt: [no-new-privileges:true]

  minio:
    ports: []
    environment:
      MINIO_ROOT_PASSWORD: null
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_SECRET_KEY
    secrets: [MINIO_SECRET_KEY]
    security_opt: [no-new-privileges:true]

  minio-init:
    profiles: [never]

  rabbitmq:
    ports: []
    environment:
      RABBITMQ_DEFAULT_USER: null
      RABBITMQ_DEFAULT_PASS: null
      RABBITMQ_CONFIG_FILE: /run/secrets/RABBITMQ_CONFIG
    secrets: [RABBITMQ_CONFIG]
    security_opt: [no-new-privileges:true]

  redis:
    ports: []
    command: ["redis-server", "/run/secrets/REDIS_CONFIG"]
    secrets: [REDIS_CONFIG]
    security_opt: [no-new-privileges:true]

  backend:
    image: ${BACKEND_IMAGE:?Use an immutable backend image tag or digest}
    build: null
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPECAI_BOOTSTRAP_ENABLED: "false"
      SPECAI_AUTH_MODE: ${SPECAI_AUTH_MODE:-local}
      DATABASE_URL: ${DATABASE_URL:?Use PostgreSQL TLS with sslmode=verify-full}
      DATABASE_USER: ${DATABASE_USER:?Set the non-superuser application role}
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:?Set the migration role}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set the HTTPS MinIO endpoint}
      MINIO_ORIGINAL_BUCKET: ${MINIO_ORIGINAL_BUCKET:?Set the environment-specific bucket}
      DOCLING_BASE_URL: ${DOCLING_BASE_URL:?Set the private HTTPS parser endpoint}
      AI_ORCHESTRATOR_BASE_URL: ${AI_ORCHESTRATOR_BASE_URL:?Set the private HTTPS AI endpoint}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact production origins}
      TLS_CERTIFICATE: /run/secrets/TLS_CERTIFICATE
      TLS_PRIVATE_KEY: /run/secrets/TLS_PRIVATE_KEY
      DATABASE_PASSWORD: null
      DATABASE_MIGRATION_PASSWORD: null
      MINIO_ACCESS_KEY: null
      MINIO_SECRET_KEY: null
      RABBITMQ_PASSWORD: null
      REDIS_PASSWORD: null
      SPECAI_JWT_SECRET: null
      SPECAI_LOCAL_ADMIN_PASSWORD: null
    secrets:
      - DATABASE_PASSWORD
      - DATABASE_MIGRATION_PASSWORD
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - RABBITMQ_PASSWORD
      - REDIS_PASSWORD
      - SPECAI_JWT_SECRET
      - SPECAI_LOCAL_ADMIN_PASSWORD
      - TLS_CERTIFICATE
      - TLS_PRIVATE_KEY
    depends_on: !override
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      document-intelligence: {condition: service_healthy}
      ai-orchestrator: {condition: service_healthy}
      clamav: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-check-certificate -q -O - https://localhost:8080/actuator/health/readiness | grep '\"status\":\"UP\"'"

  document-intelligence:
    image: ${DOCUMENT_INTELLIGENCE_IMAGE:?Use an immutable parser image tag or digest}
    build: null
    ports: []
    environment:
      S3_ACCESS_KEY: null
      S3_SECRET_KEY: null
      SECRETS_DIRECTORY: /run/secrets
    secrets:
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY

  ai-orchestrator:
    image: ${AI_ORCHESTRATOR_IMAGE:?Use an immutable AI image tag or digest}
    build: null
    ports: []

  frontend:
    image: ${FRONTEND_IMAGE:?Use an immutable frontend image tag or digest}
    build: null

secrets:
  DATABASE_PASSWORD:
    external: true
  DATABASE_MIGRATION_PASSWORD:
    external: true
  MINIO_ACCESS_KEY:
    external: true
  MINIO_SECRET_KEY:
    external: true
  RABBITMQ_CONFIG:
    external: true
  RABBITMQ_PASSWORD:
    external: true
  REDIS_CONFIG:
    external: true
  REDIS_PASSWORD:
    external: true
  SPECAI_JWT_SECRET:
    external: true
  SPECAI_LOCAL_ADMIN_PASSWORD:
    external: true
  TLS_CERTIFICATE:
    external: true
  TLS_PRIVATE_KEY:
    external: true
